<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风格写作</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #666;
    }
    #status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      background: #1a1a1a;
      color: #555;
    }
    #status-badge.ready { color: #4caf50; }
    #status-badge.error { color: #f44336; }

    .card {
      width: 100%;
      max-width: 740px;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    input[type="text"], textarea {
      width: 100%;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      resize: vertical;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #555;
    }

    .row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .row > div { flex: 1; }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #e8e8e8;
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #output-card { display: none; }

    #status-line {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 14px;
      min-height: 1.2em;
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 0.95rem;
      color: #ddd;
      min-height: 60px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #aaa;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #copy-btn {
      margin-top: 16px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      font-weight: 400;
      font-size: 0.85rem;
      padding: 8px;
    }
    #copy-btn:hover { opacity: 1; background: #2a2a2a; }

    /* RAG 召回内容折叠区 */
    #retrieval-card { display: none; }

    #retrieval-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      color: #888;
      font-size: 0.82rem;
      padding: 0;
      margin: 0;
      width: auto;
      font-weight: 400;
    }
    #retrieval-toggle:hover { color: #bbb; opacity: 1; }
    #retrieval-toggle .toggle-icon {
      display: inline-block;
      width: 14px;
      text-align: center;
      transition: transform 0.2s;
      font-style: normal;
    }
    #retrieval-toggle.open .toggle-icon { transform: rotate(90deg); }

    #retrieval-list {
      display: none;
      margin-top: 14px;
    }
    #retrieval-list.open { display: block; }

    .retrieval-item {
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .retrieval-item:last-child { margin-bottom: 0; }

    .retrieval-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #111;
      cursor: pointer;
      font-size: 0.8rem;
      color: #666;
    }
    .retrieval-item-header:hover { background: #161616; color: #999; }

    .retrieval-item-header .item-title { font-weight: 500; color: #999; }
    .retrieval-item-header .item-score {
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }

    .retrieval-item-body {
      display: none;
      padding: 12px 14px;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #bbb;
      white-space: pre-wrap;
      border-top: 1px solid #222;
    }
    .retrieval-item-body.open { display: block; }

    .retrieval-item-header .item-arrow {
      font-style: normal;
      margin-right: 6px;
      display: inline-block;
      transition: transform 0.15s;
    }
    .retrieval-item-header.open .item-arrow { transform: rotate(90deg); }
  </style>
</head>
<body>

<header>
  <h1>风格写作</h1>
  <p id="desc">基于 RAG 的风格生成</p>
  <span id="status-badge">检查索引…</span>
</header>

<div class="card">
  <div>
    <label>文章主题 *</label>
    <input type="text" id="topic" maxlength="200" placeholder="例如：《黑神话：悟空》的文化意义" />
  </div>
  <div style="margin-top: 16px;">
    <label>额外要求（可选）</label>
    <textarea id="extra" rows="2" maxlength="500" placeholder="例如：重点聊制作人的经历，结尾要有情绪升华"></textarea>
  </div>
  <button id="gen-btn">生 成 文 章</button>
</div>

<div class="card" id="retrieval-card">
  <button id="retrieval-toggle">
    <i class="toggle-icon">▶</i>
    参考片段
    <span id="retrieval-count" style="color:#555; font-weight:400;"></span>
  </button>
  <div id="retrieval-list"></div>
</div>

<div class="card" id="output-card">
  <div id="status-line"></div>
  <div id="output"></div>
  <div style="display:flex; gap:8px; margin-top:16px;">
    <button id="stop-btn" style="display:none; background:#ff4d4f; color:#fff; flex:1;">停止生成</button>
    <button id="copy-btn" style="flex:1;">复制全文</button>
  </div>
</div>

<script>
  const badge = document.getElementById('status-badge');
  const genBtn = document.getElementById('gen-btn');
  const outputCard = document.getElementById('output-card');
  const outputEl = document.getElementById('output');
  const statusLine = document.getElementById('status-line');
  const copyBtn = document.getElementById('copy-btn');
  const stopBtn = document.getElementById('stop-btn');
  const retrievalCard = document.getElementById('retrieval-card');
  const retrievalToggle = document.getElementById('retrieval-toggle');
  const retrievalList = document.getElementById('retrieval-list');
  const retrievalCount = document.getElementById('retrieval-count');

  let currentAbort = null;

  // 折叠/展开参考片段
  retrievalToggle.addEventListener('click', () => {
    retrievalToggle.classList.toggle('open');
    retrievalList.classList.toggle('open');
  });

  // 页面加载时检查索引状态
  fetch('/api/status')
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.chunks > 0) {
        badge.textContent = `索引就绪 · ${d.chunks} 个片段`;
        badge.className = 'ready';
        document.getElementById('desc').textContent = `基于 ${d.chunks} 个片段的 RAG 风格生成`;
      } else {
        badge.textContent = '索引为空，请先运行 pnpm ingest';
        badge.className = 'error';
      }
    })
    .catch(() => {
      badge.textContent = '无法连接服务器';
      badge.className = 'error';
    });

  // 停止生成
  stopBtn.addEventListener('click', () => {
    if (currentAbort) {
      currentAbort.abort();
      currentAbort = null;
    }
  });

  genBtn.addEventListener('click', async () => {
    const topic = document.getElementById('topic').value.trim();
    const extraNote = document.getElementById('extra').value.trim();

    if (!topic) {
      document.getElementById('topic').focus();
      return;
    }

    genBtn.disabled = true;
    stopBtn.style.display = 'block';
    outputCard.style.display = 'block';
    outputEl.textContent = '';
    statusLine.textContent = '';
    retrievalCard.style.display = 'none';
    retrievalList.innerHTML = '';
    retrievalList.classList.remove('open');
    retrievalToggle.classList.remove('open');
    retrievalCount.textContent = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    outputEl.appendChild(cursor);

    currentAbort = new AbortController();

    let response;
    try {
      response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, extraNote }),
        signal: currentAbort.signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') {
        statusLine.textContent = '已停止生成';
      } else {
        statusLine.textContent = '请求失败：' + err.message;
      }
      cursor.remove();
      genBtn.disabled = false;
      stopBtn.style.display = 'none';
      return;
    }

    if (!response.ok) {
      const err = await response.json();
      statusLine.textContent = '错误：' + (err.error ?? response.statusText);
      outputEl.innerHTML = '';
      genBtn.disabled = false;
      stopBtn.style.display = 'none';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    const flush = (force = false) => {
      const lines = buffer.split('\n');
      buffer = force ? '' : lines.pop();
      let currentEvent = 'message';
      for (const line of lines) {
        if (line.startsWith('event:')) {
          currentEvent = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          try {
            const payload = JSON.parse(line.slice(5).trim());
            if (currentEvent === 'retrieval' && payload.items) {
              renderRetrieval(payload.items);
            } else if (payload.token !== undefined) {
              fullText += payload.token;
              outputEl.textContent = fullText;
              outputEl.appendChild(cursor);
              outputEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else if (payload.message) {
              statusLine.textContent = payload.message;
            }
          } catch {}
          currentEvent = 'message';
        }
      }
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        flush();
      }
      flush(true);
    } catch (err) {
      if (err.name !== 'AbortError') {
        statusLine.textContent = '流式读取中断：' + err.message;
      } else {
        statusLine.textContent = '已停止生成';
      }
    }

    cursor.remove();
    genBtn.disabled = false;
    stopBtn.style.display = 'none';
    currentAbort = null;
  });

  function renderRetrieval(items) {
    retrievalList.innerHTML = '';
    items.forEach((item) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'retrieval-item';

      const header = document.createElement('div');
      header.className = 'retrieval-item-header';

      const arrow = document.createElement('i');
      arrow.className = 'item-arrow';
      arrow.textContent = '▶';

      const title = document.createElement('span');
      title.className = 'item-title';
      title.textContent = `参考 ${item.index}${item.source ? ' · ' + item.source : ''}`;

      const score = document.createElement('span');
      score.className = 'item-score';
      score.textContent = `相关度 ${(item.score * 100).toFixed(1)}%`;

      header.appendChild(arrow);
      header.appendChild(title);
      header.appendChild(score);

      const body = document.createElement('div');
      body.className = 'retrieval-item-body';
      body.textContent = item.text;

      header.addEventListener('click', () => {
        header.classList.toggle('open');
        body.classList.toggle('open');
      });

      wrapper.appendChild(header);
      wrapper.appendChild(body);
      retrievalList.appendChild(wrapper);
    });

    retrievalCount.textContent = `· ${items.length} 个片段`;
    retrievalCard.style.display = 'block';
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputEl.textContent).then(() => {
      copyBtn.textContent = '已复制！';
      setTimeout(() => { copyBtn.textContent = '复制全文'; }, 1500);
    });
  });
</script>
</body>
</html>
