<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>风格写作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-2: #1c1c20;
      --border: #27272c;
      --border-focus: #4a4a55;
      --text: #e4e4e7;
      --text-dim: #71717a;
      --text-muted: #52525b;
      --accent: #c8a96e;
      --accent-dim: #8a7344;
      --danger: #ef4444;
      --success: #4ade80;
      --radius: 10px;
      --font-display: 'Noto Serif SC', Georgia, serif;
      --font-body: 'Noto Sans SC', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ─────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .panel-left {
      width: 420px;
      min-width: 360px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 32px 28px 48px;
    }
    .panel-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-right-inner {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 48px;
    }

    @media (max-width: 860px) {
      .layout {
        flex-direction: column;
        overflow-y: auto;
      }
      .panel-left {
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--border);
        overflow-y: visible;
      }
      .panel-right-inner {
        overflow-y: visible;
      }
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #fff;
      position: relative;
      display: inline-block;
    }
    header h1::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 2px;
      background: var(--accent);
    }
    #desc {
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.02em;
    }
    #status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    #status-badge.ready { color: var(--success); border-color: #166534; }
    #status-badge.error { color: var(--danger); border-color: #7f1d1d; }
    #status-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }

    /* ── Card ───────────────────────────────────────── */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      animation: slideUp 0.5s ease both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* ── Form ───────────────────────────────────────── */
    .field { margin-bottom: 20px; }
    .field:last-of-type { margin-bottom: 0; }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      font-weight: 500;
    }
    .field label .required {
      color: var(--accent);
      font-size: 0.7rem;
    }
    .field label .hint {
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.72rem;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: var(--font-body);
      resize: vertical;
      line-height: 1.6;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-dim);
      font-weight: 300;
      opacity: 0.6;
    }
    input:focus, textarea:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 2px rgba(200, 169, 110, 0.08);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .field-row { grid-template-columns: 1fr; }
    }

    /* ── Buttons ────────────────────────────────────── */
    .btn-primary {
      margin-top: 24px;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: var(--surface-2);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-secondary:hover { background: var(--border); color: var(--text); }

    .btn-danger {
      flex: 1;
      padding: 10px;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

    /* ── Output ─────────────────────────────────────── */
    #output-card { display: none; }
    #output-card.visible { display: block; }

    .panel-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      user-select: none;
    }

    #status-line {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      min-height: 1.2em;
      font-weight: 300;
    }

    #output {
      white-space: pre-wrap;
      line-height: 2;
      font-size: 0.92rem;
      color: #d4d4d8;
      min-height: 60px;
      font-family: var(--font-body);
      font-weight: 300;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Retrieval ──────────────────────────────────── */
    #retrieval-card { display: none; }

    #retrieval-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-family: var(--font-body);
      padding: 0;
      margin: 0;
      width: auto;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    #retrieval-toggle:hover { color: var(--text); }
    #retrieval-toggle .toggle-icon {
      display: inline-block;
      width: 12px;
      text-align: center;
      transition: transform 0.2s;
      font-style: normal;
      font-size: 0.7rem;
    }
    #retrieval-toggle.open .toggle-icon { transform: rotate(90deg); }

    #retrieval-list { display: none; margin-top: 16px; }
    #retrieval-list.open { display: block; }

    .retrieval-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .retrieval-item:last-child { margin-bottom: 0; }

    .retrieval-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: var(--bg);
      cursor: pointer;
      font-size: 0.76rem;
      color: var(--text-muted);
      transition: color 0.15s;
    }
    .retrieval-item-header:hover { color: var(--text-dim); }

    .retrieval-item-header .item-title { font-weight: 500; color: var(--text-dim); }
    .retrieval-item-header .item-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .retrieval-item-header .item-type {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(200, 169, 110, 0.1);
      color: var(--accent-dim);
    }
    .retrieval-item-header .item-score {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .retrieval-item-body {
      display: none;
      padding: 12px 14px;
      font-size: 0.82rem;
      line-height: 1.8;
      color: #a1a1aa;
      white-space: pre-wrap;
      border-top: 1px solid var(--border);
      font-weight: 300;
    }
    .retrieval-item-body.open { display: block; }

    .retrieval-item-header .item-arrow {
      font-style: normal;
      margin-right: 6px;
      display: inline-block;
      transition: transform 0.15s;
      font-size: 0.65rem;
    }
    .retrieval-item-header.open .item-arrow { transform: rotate(90deg); }
  </style>
</head>
<body>

<div class="layout">
  <!-- ── 左侧：输入面板 ── -->
  <div class="panel-left">
    <header>
      <h1>风格写作</h1>
      <p id="desc">基于 RAG 的风格生成</p>
      <span id="status-badge"><span class="dot"></span> 检查索引…</span>
    </header>

    <div class="card" style="animation-delay: 0.1s">
      <div class="card-title">创作输入</div>

      <div class="field">
        <label>文章主题 <span class="required">*</span></label>
        <input type="text" id="topic" maxlength="200" placeholder="例如：为什么独立游戏正在吞噬 3A 大作的灵魂" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>相关事件 <span class="hint">现实 / 历史</span></label>
          <textarea id="events" rows="2" maxlength="500" placeholder="例如：2024年《小丑牌》获年度最佳，3A大厂裁员潮"></textarea>
        </div>
        <div class="field">
          <label>背景补充 <span class="hint">行业 / 文化</span></label>
          <textarea id="context" rows="2" maxlength="500" placeholder="例如：Steam独立游戏市场份额连续3年增长"></textarea>
        </div>
      </div>

      <div class="field">
        <label>额外要求 <span class="hint">可选</span></label>
        <textarea id="extra" rows="2" maxlength="500" placeholder="例如：结尾用一个具体的画面定格，不要抒情升华"></textarea>
      </div>

      <button class="btn-primary" id="gen-btn">生成文章</button>
    </div>

    <div class="card" id="retrieval-card" style="animation-delay: 0.15s">
      <button id="retrieval-toggle">
        <i class="toggle-icon">▶</i>
        参考片段
        <span id="retrieval-count" style="color:var(--text-muted); font-weight:300;"></span>
      </button>
      <div id="retrieval-list"></div>
    </div>
  </div>

  <!-- ── 右侧：文章输出面板 ── -->
  <div class="panel-right">
    <div class="panel-right-inner" id="panel-right-inner">
      <div class="panel-placeholder" id="placeholder">填写左侧信息，点击「生成文章」开始创作</div>

      <div class="card" id="output-card" style="animation-delay: 0.2s">
        <div id="status-line"></div>
        <div id="output"></div>
        <div class="btn-row">
          <button class="btn-danger" id="stop-btn">停止生成</button>
          <button class="btn-secondary" id="copy-btn">复制全文</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const badge = $('status-badge');
  const genBtn = $('gen-btn');
  const outputCard = $('output-card');
  const outputEl = $('output');
  const statusLine = $('status-line');
  const copyBtn = $('copy-btn');
  const stopBtn = $('stop-btn');
  const retrievalCard = $('retrieval-card');
  const retrievalToggle = $('retrieval-toggle');
  const retrievalList = $('retrieval-list');
  const retrievalCount = $('retrieval-count');
  const placeholder = $('placeholder');
  const panelInner = $('panel-right-inner');

  let currentAbort = null;

  retrievalToggle.addEventListener('click', () => {
    retrievalToggle.classList.toggle('open');
    retrievalList.classList.toggle('open');
  });

  fetch('/api/status')
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.chunks > 0) {
        badge.innerHTML = `<span class="dot"></span> 索引就绪 · ${d.chunks} 个片段`;
        badge.className = 'ready';
        $('desc').textContent = `基于 ${d.chunks} 个片段的 RAG 风格生成`;
      } else {
        badge.innerHTML = '<span class="dot"></span> 索引为空，请先运行 pnpm ingest';
        badge.className = 'error';
      }
    })
    .catch(() => {
      badge.innerHTML = '<span class="dot"></span> 无法连接服务器';
      badge.className = 'error';
    });

  stopBtn.addEventListener('click', () => {
    if (currentAbort) { currentAbort.abort(); currentAbort = null; }
  });

  genBtn.addEventListener('click', async () => {
    const topic = $('topic').value.trim();
    const extraNote = $('extra').value.trim();
    const events = $('events').value.trim();
    const context = $('context').value.trim();

    if (!topic) { $('topic').focus(); return; }

    genBtn.disabled = true;
    stopBtn.style.display = 'block';
    placeholder.style.display = 'none';
    outputCard.style.display = 'block';
    outputEl.textContent = '';
    statusLine.textContent = '';
    retrievalCard.style.display = 'none';
    retrievalList.innerHTML = '';
    retrievalList.classList.remove('open');
    retrievalToggle.classList.remove('open');
    retrievalCount.textContent = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    outputEl.appendChild(cursor);

    currentAbort = new AbortController();

    let response;
    try {
      response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, extraNote, events, context }),
        signal: currentAbort.signal,
      });
    } catch (err) {
      statusLine.textContent = err.name === 'AbortError' ? '已停止生成' : '请求失败：' + err.message;
      cursor.remove();
      genBtn.disabled = false;
      stopBtn.style.display = 'none';
      return;
    }

    if (!response.ok) {
      const err = await response.json();
      statusLine.textContent = '错误：' + (err.error ?? response.statusText);
      outputEl.innerHTML = '';
      genBtn.disabled = false;
      stopBtn.style.display = 'none';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    const flush = (force = false) => {
      const lines = buffer.split('\n');
      buffer = force ? '' : lines.pop();
      let currentEvent = 'message';
      for (const line of lines) {
        if (line.startsWith('event:')) {
          currentEvent = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          try {
            const payload = JSON.parse(line.slice(5).trim());
            if (currentEvent === 'retrieval' && payload.items) {
              renderRetrieval(payload.items);
            } else if (payload.token !== undefined) {
              fullText += payload.token;
              outputEl.textContent = fullText;
              outputEl.appendChild(cursor);
              panelInner.scrollTop = panelInner.scrollHeight;
            } else if (payload.message) {
              statusLine.textContent = payload.message;
            }
          } catch {}
          currentEvent = 'message';
        }
      }
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        flush();
      }
      flush(true);
    } catch (err) {
      statusLine.textContent = err.name === 'AbortError' ? '已停止生成' : '流式读取中断：' + err.message;
    }

    cursor.remove();
    genBtn.disabled = false;
    stopBtn.style.display = 'none';
    currentAbort = null;
  });

  function renderRetrieval(items) {
    retrievalList.innerHTML = '';
    items.forEach((item) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'retrieval-item';

      const header = document.createElement('div');
      header.className = 'retrieval-item-header';

      const arrow = document.createElement('i');
      arrow.className = 'item-arrow';
      arrow.textContent = '▶';

      const title = document.createElement('span');
      title.className = 'item-title';
      title.textContent = `片段 ${item.index}${item.source ? ' · ' + item.source.replace(/_cv\d+\.txt$/, '') : ''}`;

      const meta = document.createElement('span');
      meta.className = 'item-meta';

      if (item.type) {
        const typeBadge = document.createElement('span');
        typeBadge.className = 'item-type';
        typeBadge.textContent = item.type;
        meta.appendChild(typeBadge);
      }

      if (item.score > 0) {
        const score = document.createElement('span');
        score.className = 'item-score';
        score.textContent = `${(item.score * 100).toFixed(0)}%`;
        meta.appendChild(score);
      }

      header.appendChild(arrow);
      header.appendChild(title);
      header.appendChild(meta);

      const body = document.createElement('div');
      body.className = 'retrieval-item-body';
      body.textContent = item.text;

      header.addEventListener('click', () => {
        header.classList.toggle('open');
        body.classList.toggle('open');
      });

      wrapper.appendChild(header);
      wrapper.appendChild(body);
      retrievalList.appendChild(wrapper);
    });

    retrievalCount.textContent = `· ${items.length} 个片段`;
    retrievalCard.style.display = 'block';
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputEl.textContent).then(() => {
      copyBtn.textContent = '已复制';
      setTimeout(() => { copyBtn.textContent = '复制全文'; }, 1500);
    });
  });
</script>
</body>
</html>
