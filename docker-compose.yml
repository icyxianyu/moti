services:
  # ── Ollama 嵌入服务 ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # 不对外暴露端口，只在 Docker 内网给 app 调用

  # ── Next.js 应用 ─────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:3000"
    # 从宿主机 .env 读取全部配置（AUTH_SECRET / LLM_* / ADMIN_* / *_CONCURRENCY …）
    env_file:
      - .env
    # 容器内强制覆盖 Ollama 地址（.env 里写的是 localhost，那是宿主机视角）
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NODE_ENV=production
    volumes:
      - app_data:/app/data
    depends_on:
      - ollama

volumes:
  ollama_data:
  app_data:
